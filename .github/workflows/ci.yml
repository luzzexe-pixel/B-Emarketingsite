name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax
        run: |
          node --check js/main.js
          node --check jh-plumbing/js/main.js
          node --check jh-plumbing/js/brassline.js

      - name: Site checks (JSON-LD, links, ids)
        run: node scripts/check.mjs

      - name: JH Plumbing build is up to date and passes guards
        run: |
          node jh-plumbing/build.mjs
          git diff --exit-code -- jh-plumbing
          node jh-plumbing/check.mjs

      - name: HTML validation (JH Plumbing)
        run: npx --yes html-validate@9 "jh-plumbing/**/*.html"

      - name: HTML validation
        run: npx --yes html-validate@9 index.html privacy.html
